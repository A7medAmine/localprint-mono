name: Release desktop app

# Push a tag like `v1.2.0` to build the Windows installer and publish it (plus
# latest.yml, which electron-updater reads) to a GitHub Release. The app's
# built-in auto-updater (apps/desktop/electron/updater.js) polls this repo's
# Releases feed — see build.publish in apps/desktop/package.json.
on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # node-gyp's own VS detection (find-visualstudio.js) misses the
      # runner's preinstalled VS2022 Build Tools despite them being present —
      # this puts cl.exe/INCLUDE/LIB on PATH directly so the better-sqlite3
      # native rebuild below can compile.
      - uses: ilammy/msvc-dev-cmd@v1

      # Scripts ARE needed here (electron-rebuild of better-sqlite3 against
      # Electron's Node ABI) — unlike CI's --ignore-scripts fast path.
      - run: npm ci

      - name: Build + publish installer
        working-directory: apps/desktop
        run: npm run electron:release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Baked into the installer by scripts/generate-packaged-env.js so the
          # packaged app can run the Gmail OAuth flow. Without these the build
          # fails fast instead of shipping an installer where "Connect Gmail"
          # is silently broken.
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
